<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
                initial-scale=1.0">
    <title>crie sua conta</title>
    <link rel="stylesheet" href="Scheila.css">
</head>
<body>
<section id="cadastro">
      <h2> Crie sua conta na Santo Burguer</h2>
      <p> Cadastre-se para receber promoções exclusivas</p>

 <form action="cadastro.html" method="post">

             <div style="margin-bottom: 15px;">
      <label for="nome"> Nome Completo </label><br>
      <input type="text"
             id="nome"
             name="nome"
             placeholder="Digite o seu nome"
             required minlength="2" size="50"><br>
        </div><br>

             <div style="margin-bottom: 15px;">
      <label for="Telefone"> Telefone  </label>
      <input type="tel"  
             id="Telefone" 
             name="Telefone" 
             placeholder="Número de telefone" 
             required  minlength="9" maxlength="9">
        </div><br>

             <div style="margin-bottom: 15px;">
         <label for="id_email"> Email </label>
      <input type="email"  
           id="id_email" 
           name="var_email" 
           placeholder="Digite o seu email" 
           required 
           minlength="2" 
           maxlength="20">
        </div><br>

              <div style="margin-bottom: 15px;"></div>
      <input type="radio" 
             id="masculino" 
             name="genero" 
             value="masculino">
          <label for="masculino">Masculino</label>
      <input type="radio" 
             id="feminino" 
             name="genero" 
             value="feminino">
          <label for="feminino">Feminino</label>
      <input type="radio" 
             id="não_informar" 
             name="genero" 
             value="não informar">
          <label for="não informar">Não informar</label>
        </div>
            <br>
             <div style="margin-bottom: 15px;">
      <label for="senha">Senha:</label><br>
      <input type="password"
             id="senha" 
             name="senha" 
             placeholder="Crie uma senha" 
             required>
    </div>
    <button>Enviar</button>
      

</form>
</section>


</body>
</html>
